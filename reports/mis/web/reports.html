<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Nellon MIS reports: Executive Summary, P&L, Balance Sheet, Trial Balance, Margin and Purchases by month.">
<title>Reports · Nellon MIS</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to report</a>

<div class="app fill">
  <div class="page">
    <header class="appbar">
      <div class="titles">
        <h1>MIS Reports</h1>
        <p class="subtitle" id="orgName"></p>
      </div>
      <div class="actions">
        <a id="exportBtn" class="icon-btn filled" href="api/export.xlsx" aria-disabled="true"
           aria-label="Export to Excel"
           title="Export to Excel (One workbook with Executive Summary, PL, BS and Trial Balance on separate sheets)">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#download"/></svg>
        </a>
      </div>
    </header>

    <nav class="tabs" id="tabs" aria-label="Reports"></nav>

    <div class="toolbar datebar" id="datebar" role="group" aria-label="Date range"></div>
    <div class="toolbar" id="toolbar"></div>

    <main class="content" id="main" tabindex="-1">
      <section class="surface" aria-labelledby="reportTitle">
        <div class="surface-head">
          <h2 class="rpt-name" id="reportTitle"></h2>
          <div class="rpt-period">
            <span class="rpt-dates num" id="period"></span>
            <span class="rpt-ccy" id="ccy" hidden></span>
          </div>
        </div>
        <div class="scroll" id="out" aria-live="polite"></div>
      </section>
    </main>
  </div>
</div>

<div class="snackbar" id="snackbar" role="status" aria-live="polite"></div>

<script src="assets/webtab-auth.js"></script>
<script src="assets/date-filter.js"></script>
<script src="assets/report-tabs.js"></script>
<script src="assets/reports.js"></script>
</body>
</html>
