<!DOCTYPE html>
<html lang="en" data-accent="sky">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390" />
  <title>Stock Unloading</title>
  <link rel="stylesheet" href="editor.css" />
</head>
<body>
  <div class="phone">
    <div class="status"><span>9:41</span><span>4G  ·  78%</span></div>

    <div class="bezel">
      <div class="core header">
        <div class="icon-btn">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </div>
        <div class="head-copy">
          <span class="eyebrow">Today</span>
          <h1>Stock Unloading</h1>
        </div>
      </div>
    </div>

    <div class="stack">
      <div class="bezel">
        <div class="core route">
          <div class="leg">
            <span>From</span>
            Van SHINAD
          </div>
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <div class="leg to">
            <span>To</span>
            Main Store
          </div>
        </div>
      </div>

      <div class="section-head">
        <div>
          <div class="kicker">End of trip</div>
          <h2>Balance to return</h2>
        </div>
      </div>

      <div class="bezel">
        <div class="core stock">
          <div class="stock-top">
            <div class="grow">
              <div class="title">Nellon Ghee 1kg</div>
              <div class="meta">On van · 8 tin</div>
            </div>
            <div class="grand">
              <div class="kicker">Unload</div>
              <div class="fig">8</div>
            </div>
          </div>
          <div class="stepper">
            <div class="step"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></div>
            <div>
              <div class="qty-box">8</div>
              <div class="uom">tin</div>
            </div>
            <div class="step"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></div>
          </div>
        </div>
      </div>

      <div class="bezel">
        <div class="core stock">
          <div class="stock-top">
            <div class="grow">
              <div class="title">Sunflower Oil 5L</div>
              <div class="meta">On van · 3 can</div>
            </div>
            <div class="grand">
              <div class="kicker">Unload</div>
              <div class="fig">3</div>
            </div>
          </div>
          <div class="stepper">
            <div class="step"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></div>
            <div>
              <div class="qty-box">3</div>
              <div class="uom">can</div>
            </div>
            <div class="step"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></div>
          </div>
        </div>
      </div>

      <div class="bezel">
        <div class="core stock">
          <div class="stock-top">
            <div class="grow">
              <div class="title">Basmati Rice 10kg</div>
              <div class="meta">On van · 1 bag</div>
            </div>
            <div class="grand">
              <div class="kicker">Unload</div>
              <div class="fig">1</div>
            </div>
          </div>
          <div class="stepper">
            <div class="step"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></div>
            <div>
              <div class="qty-box">1</div>
              <div class="uom">bag</div>
            </div>
            <div class="step"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></div>
          </div>
        </div>
      </div>
    </div>

    <div class="bezel footer">
      <div class="core till">
        <div class="till-top">
          <div>
            <div class="total-label">Qty to unload</div>
            <div class="total">12.00</div>
          </div>
          <div class="cta">Unload <span class="dot"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
