<!DOCTYPE html>
<html lang="en" data-accent="indigo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390" />
  <title>Issue to Van</title>
  <link rel="stylesheet" href="editor.css" />
</head>
<body>
  <div class="phone">
    <div class="status"><span>9:41</span><span>4G  ·  78%</span></div>

    <div class="bezel">
      <div class="core header">
        <div class="icon-btn">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </div>
        <div class="head-copy">
          <span class="eyebrow">Today</span>
          <h1>Issue to Van</h1>
        </div>
      </div>
    </div>

    <div class="stack">
      <div class="bezel">
        <div class="core route">
          <div class="leg">
            <span>From</span>
            Main Store
          </div>
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <div class="leg to">
            <span>To</span>
            Van SHINAD
          </div>
        </div>
      </div>

      <div class="section-head">
        <div>
          <div class="kicker">17 Aug 2026</div>
          <h2>Load plan</h2>
        </div>
        <div class="add">Add <span class="dot"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></span></div>
      </div>

      <div class="bezel">
        <div class="core stock">
          <div class="stock-top">
            <div class="grow">
              <div class="title">Nellon Ghee 1kg</div>
              <div class="meta">On van now · 8 tin</div>
            </div>
            <div class="grand">
              <div class="kicker">Grand</div>
              <div class="fig">20</div>
            </div>
            <div class="ghost"><svg viewBox="0 0 24 24"><path d="M6 7h12M10 11v6M14 11v6M9 7V5h6v2M7 7l1 12h8l1-12"/></svg></div>
          </div>
          <div class="stepper">
            <div class="step"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></div>
            <div>
              <div class="qty-box">12</div>
              <div class="uom">extra tin</div>
            </div>
            <div class="step"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></div>
          </div>
        </div>
      </div>

      <div class="bezel">
        <div class="core stock">
          <div class="stock-top">
            <div class="grow">
              <div class="title">Sunflower Oil 5L</div>
              <div class="meta">On van now · 4 can</div>
            </div>
            <div class="grand">
              <div class="kicker">Grand</div>
              <div class="fig">10</div>
            </div>
            <div class="ghost"><svg viewBox="0 0 24 24"><path d="M6 7h12M10 11v6M14 11v6M9 7V5h6v2M7 7l1 12h8l1-12"/></svg></div>
          </div>
          <div class="stepper">
            <div class="step"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></div>
            <div>
              <div class="qty-box">6</div>
              <div class="uom">extra can</div>
            </div>
            <div class="step"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></div>
          </div>
        </div>
      </div>

      <div class="bezel">
        <div class="core stock">
          <div class="stock-top">
            <div class="grow">
              <div class="title">Basmati Rice 10kg</div>
              <div class="meta">On van now · 2 bag</div>
            </div>
            <div class="grand">
              <div class="kicker">Grand</div>
              <div class="fig">5</div>
            </div>
            <div class="ghost"><svg viewBox="0 0 24 24"><path d="M6 7h12M10 11v6M14 11v6M9 7V5h6v2M7 7l1 12h8l1-12"/></svg></div>
          </div>
          <div class="stepper">
            <div class="step"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></div>
            <div>
              <div class="qty-box">3</div>
              <div class="uom">extra bag</div>
            </div>
            <div class="step"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></div>
          </div>
        </div>
      </div>
    </div>

    <div class="bezel footer">
      <div class="core till">
        <div class="till-top">
          <div>
            <div class="total-label">Qty to issue</div>
            <div class="total">21.00</div>
          </div>
          <div class="cta">Issue <span class="dot"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
