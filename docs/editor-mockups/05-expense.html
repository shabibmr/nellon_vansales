<!DOCTYPE html>
<html lang="en" data-accent="rose">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390" />
  <title>Expense</title>
  <link rel="stylesheet" href="editor.css" />
</head>
<body>
  <div class="phone">
    <div class="status"><span>9:41</span><span>4G  ·  78%</span></div>

    <div class="bezel">
      <div class="core header">
        <div class="icon-btn">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </div>
        <div class="head-copy">
          <span class="eyebrow">New</span>
          <h1>Expense</h1>
        </div>
      </div>
    </div>

    <div class="stack">
      <div class="bezel">
        <div class="core tile">
          <div class="row">
            <div class="avatar">
              <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="14" rx="2"/><path d="M8 4v4M16 4v4M4 11h16"/></svg>
            </div>
            <div class="grow">
              <div class="kicker">Expense date</div>
              <div class="title">17 Aug 2026</div>
              <div class="meta">Today</div>
            </div>
          </div>
        </div>
      </div>

      <div class="bezel">
        <div class="core tile">
          <div class="kicker">Category</div>
          <div class="pills">
            <span class="pill on">Fuel</span>
            <span class="pill">Tolls</span>
            <span class="pill">Maintenance</span>
            <span class="pill">Parking</span>
          </div>
          <div class="kicker" style="margin-top:16px">Amount</div>
          <div class="hero-amt">AED 145.00</div>
        </div>
      </div>

      <div class="bezel">
        <div class="core notes">
          <div class="kicker">Description</div>
          <p class="filled">ENOC Jebel Ali — full tank, van SHINAD.</p>
        </div>
      </div>

      <div class="bezel">
        <div class="core" style="padding:8px">
          <div class="dash">
            <div class="ico">
              <svg viewBox="0 0 24 24"><path d="M4 8h4l2-3h4l2 3h4v11H4z"/><circle cx="12" cy="14" r="3.2"/></svg>
            </div>
            <strong>Attach receipt</strong>
            <span>Camera or gallery</span>
          </div>
        </div>
      </div>
    </div>

    <div class="bezel footer">
      <div class="core till">
        <div class="till-top">
          <div>
            <div class="total-label">Total expense</div>
            <div class="total">AED 145.00</div>
          </div>
          <div class="cta">Save <span class="dot"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-9"/></svg></span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
