# Optimized for 8 GB RAM / 2 vCPU environment:
# Limits heap to 2048m and metaspace to 512m to prevent Out-Of-Memory (OOM) killer during concurrent Flutter/Dart AOT compilation.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
